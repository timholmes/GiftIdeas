name: Deploy (staging)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download functions build artifact
        uses: actions/download-artifact@v4
        with:
          name: functions-lib
          path: functions/lib
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Authenticate to Firebase
        run: echo "$FIREBASE_SERVICE_ACCOUNT_STAGING" > /tmp/gcp-key.json
        env:
          FIREBASE_SERVICE_ACCOUNT_STAGING: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}

      - name: Deploy rules, indexes, and functions to staging
        run: npx firebase-tools deploy --project staging --only firestore:rules,firestore:indexes,functions --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
