name: EAS Build (iOS)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "eas.json build profile"
        type: choice
        options:
          - preview
          - development
          - production
        default: preview

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Trigger EAS build
        # Builds run on EAS's own infrastructure, not this runner, so
        # --no-wait lets this job finish immediately instead of burning
        # Actions minutes idling on a build that takes place elsewhere.
        # Track progress via `eas build:list` or the Expo dashboard.
        run: eas build --platform ios --profile ${{ inputs.profile }} --non-interactive --no-wait
