name: Deploy (production)

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Find latest successful CI run on main
        id: ci_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=ci.yml --branch=main --status=success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "No successful CI run found for main" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download functions build artifact
        uses: actions/download-artifact@v4
        with:
          name: functions-lib
          path: functions/lib
          github-token: ${{ github.token }}
          run-id: ${{ steps.ci_run.outputs.run_id }}

      - name: Authenticate to Firebase
        run: echo "$FIREBASE_SERVICE_ACCOUNT_PROD" > /tmp/gcp-key.json
        env:
          FIREBASE_SERVICE_ACCOUNT_PROD: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}

      - name: Deploy rules, indexes, and functions to production
        run: npx firebase-tools deploy --project default --only firestore:rules,firestore:indexes,functions --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
