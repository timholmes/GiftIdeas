# Steps
# - Launch the app
# - Navigate to the "Connections" tab
# - Add a new connection
# - Verify the connection request is pending
appId: com.timdholmes.GiftIdeas
---
- launchApp:
    clearState: true
- runFlow:
    file: subflows/setup-steps.yaml
- tapOn: "Me"
- tapOn: "Connections, tab, 4 of 4"
- assertVisible: "No connections yet. Add someone above!"
- tapOn:
    id: "add-connection-email"
- inputText: "friend1@example.com"
- tapOn: "Send"
- extendedWaitUntil:
    visible: "Sent · 1"
    timeout: 15000
- assertVisible: "friend1@example.com"
- assertVisible: "Waiting for them to respond"
