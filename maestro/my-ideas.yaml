appId: com.timdholmes.GiftIdeas
---
- launchApp:
    clearState: true
- runFlow:
    file: subflows/setup-steps.yaml
- tapOn: "Me"
- tapOn: "My ideas, tab, 2 of 4"
- assertVisible: "Weekend Cabin Gift"
- assertVisible: "Book a two-night cabin stay with hiking nearby."
- assertVisible: "Coffee Subscription"
- assertVisible: "Three-month small-batch coffee subscription."
